[project]
name = "credential-auditor"
version = "0.1.0"
description = "Local browser/credential hygiene auditor: flags over-permissioned extensions, plaintext secrets in app configs, and risky browser settings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joey Wang" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
credaudit = "credaudit.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
